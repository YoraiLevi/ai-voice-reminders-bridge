[project]
name = "voice-bridge"
version = "0.1.0"
description = "Add an async voice spoke to a file-mailbox agent system — talk to your mailbox from your phone via Apple Reminders."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # transports pull their own backends lazily; kept out of the core install so
    # the iCloud path never forces CalDAV deps and vice versa. Installed extras:
]

[project.optional-dependencies]
icloud = ["pyicloud"]
caldav = ["caldav>=3.2,<4", "icalendar>=6,<8"]
all = ["pyicloud", "caldav>=3.2,<4", "icalendar>=6,<8"]
dev = ["pytest>=8", "ruff", "mypy"]

[project.scripts]
voice-bridge = "voice_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
